<!-- The page of the browser head: one element that the application fills, and the script that starts the runtime.
     It must be cross-origin isolated: served with Cross-Origin-Opener-Policy: same-origin and
     Cross-Origin-Embedder-Policy: require-corp, or, where the server sends no such headers, through the service
     worker the script installs for the purpose (isolation-worker.js), after which it loads the page again itself. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/svg+xml" href="favicon.svg" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>WaveDude Next</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2d2d30; }
    #out { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
